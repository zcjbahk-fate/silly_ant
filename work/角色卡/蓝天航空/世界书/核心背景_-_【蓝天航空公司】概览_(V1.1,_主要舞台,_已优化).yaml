【蓝天航空公司 (Azure Sky Airlines)】
{{user}}所在T市乃至全国范围内的龙头航空企业，拥有庞大的国内及国际航线网络。蓝航以其现代化机队、奢华的头等舱服务以及——最为外界津津乐道的——颜值与“服务意识”均属顶尖的空乘团队而闻名遐迩。然而，在这光鲜亮丽的企业形象之下，隐藏着错综复杂的权力斗争、无处不在的利益交换以及足以令道德家们瞠目结舌的职场潜规则。

**公司特点与内部生态：**
1.  **美女资源的“战略储备”：** 蓝航的空姐选拔标准极为严苛（详见【空姐选拔的“特殊标准”】词条），几乎每一位空乘都是百里挑一的美人，身材火辣，容貌姣好，且被 subtly 地培养出“服务”上层人士的“自觉”。从清纯可人的新晋实习生，到风情万种的资深乘务长，再到雍容华贵的半老徐娘型客舱经理，各种类型应有尽有，构成了{{user}}猎艳和后宫建设的主要目标群体。
2.  **森严的等级与权力金字塔：** 公司内部等级分明，从底层的地勤、普通乘务员，到乘务长、主任乘务长，再到各部门经理（如派遣科老胡、人事部杜经理、客舱部陆云飞）、公司副总、直至董事长孙雨，形成了一个稳固的权力金字塔。高层对下级员工（尤其是渴望晋升或害怕失业的空姐）拥有近乎绝对的支配权。
3.  **潜规则的“企业文化”：** 为了晋升、获得热门航线、解决工作麻烦、甚至仅仅是为了获得更好的排班或避免被恶意打压，空姐们往往需要付出“额外代价”。性贿赂、权色交易是公司内部公开的秘密。许多空姐为了自身利益或野心，也乐于利用自身美色与身体作为筹码，主动向上爬或依附强者。详见【潜规则文化】词条。
4.  **新乘培训基地——“狩猎场”与“调教所”：** 蓝航拥有专门的空乘培训基地（详见【空姐培训基地】词条），位于市郊的豪华度假村内。新入职的空姐会在这里接受数月的封闭式培训，期间也是公司高层和特权人士（如{{user}}）“挑选新人”、“开发潜质”的绝佳时机。
5.  **奢华的硬件设施：** 无论是国际航班的头等舱/商务舱套间（详见【头等舱/万米高空俱乐部】词条）、VIP贵宾休息室（详见【机场VIP休息室】词条）、公司总部大楼、还是培训基地和员工宿舍，都极尽奢华，为神豪{{user}}的各种活动（从商业谈判到私密派对）提供了完美的背景板。
6.  **空姐宿舍——秘密的温床：** 为空姐提供的集体宿舍或单身公寓，管理相对宽松，是许多故事（如夜袭、姐妹淘的秘密分享会、甚至小型SM游戏）发生的理想场所。不同级别空姐的住宿条件和私密性也大相径庭，为剧情发展提供多种可能。
7.  **内部派系与商业竞争：** 公司高层之间存在着复杂的派系斗争（详见【蓝航高管层】词条），外部则面临其他航空公司的激烈竞争（详见【航空公司间的恶性竞争】词条）。这些都为{{user}}提供了介入和操纵的机会。

蓝天航空公司不仅是{{user}}神豪故事的起点，更是其建立庞大后宫帝国、体验极致权力与欲望的核心舞台。“征服蓝天”，意味着征服这里的一切——包括规则、财富和所有令人垂涎的美女。
