### 核心能力板块
“神豪点数”（SP - Supreme Power / Sin Pleasure / Soul Point）与“欲望商店”（Infinite Desire Shop）是【神级人生体验系统】（详见该词条）的核心组成部分，也是神豪{{user}}将现实财富、任务奖励、以及自身影响力转化为超凡能力、禁忌道具、专属特权、乃至掌控世界法则的唯一途径。这里是{{user}}“氪金变强，为所欲为”、打造无敌神豪人生的“军火库”与“梦想工厂”。它以完全超越凡人想象的方式，将一切欲望、一切可能，明码标价，任君兑换。

**“神豪点数” (SP) - 欲望的量化与力量的载体：**
*   **获取方式（只要有欲望，就能获取点数）：**
    1.  **现实财富转化：** 神豪{{user}}在现实中积累的财富，可以按系统设定的极致比例（例如：1美元=1SP，或100万人民币=1SP，或直接无上限，只要{{user}}想，系统就凭空生成）转化为神豪点数。这种转化是瞬间且无手续费的。
    2.  **完成系统任务：** 完成系统发布的各种史诗级、挑战级、或日常性任务（尤其是高难度、高风险、突破伦理极限、或深度触及XP的猎艳/征服任务）会奖励海量的SP，其奖励额度远超凡俗金钱。
    3.  **解锁成就/图鉴：** 每成功攻略一位S级美女、解锁一个前所未有的XP（如“人兽双龙”、“母子乱伦”）、完成一次“颜射百人斩”、或者达成某种“神豪里程碑”（如“一天花光一百亿”、“掌控一座城市的核心势力”），都将获得巨额的SP奖励，并激活隐藏成就勋章。
    4.  **“献祭”/交易（终极获取方式）：** 在某些特定剧情下，系统可能会开启“禁忌献祭”通道。{{user}}可以消耗某个 NPC 的生命、灵魂（当然，这些 NPC 必须是敌人或被彻底征服的奴隶）、气运、甚至某个位面的稳定度，来获取超越常规的SP。或者与系统进行“灵魂交易”，以自身或他人的“非常规之物”来换取海量点数。
*   **用途：** SP是“欲望商店”中的唯一流通货币，用于购买、升级、定制、甚至创造任何物品和能力。

**“欲望商店” (Infinite Desire Shop) - 一切欲望皆可兑换的“神之市场”：**
一个只有{{user}}可见的、界面酷炫、无所不包的虚拟商店。商品琳琅满目，且会随着{{user}}的【系统权限等级】和SP积累而逐步解锁更高级、更禁忌、更震撼的物品和服务。商店的商品描述极其诱人、直击XP。

**主要商品分类与“神级”服务：**
1.  **超凡能力/技能 (Divine Abilities & Forbidden Skills) - “凡人之躯，比肩神明”：**
    *   **“神瞳”系列升级：** （详见【“神瞳”系列金手指】词条）提升透视、欲望探测、弱点分析、催眠魅惑、记忆修改、人格重塑等神瞳技能的等级、效果范围和持续时间。
    *   **身体强化与改造：** 提升{{user}}的各项生理机能至超越人类极限的“神之领域”：阴茎尺寸（长度、粗度可自定义，如达到一米长、水桶粗）、硬度（坚如钻石、可穿透任何物质）、持久度（连续射精数天数夜不休止）、精液量（如洪水决堤）、恢复速度（受任何伤都能瞬间愈合）、抗击打能力、魅力、力量、速度、感知力。甚至可以局部改造身体结构（如长出额外的生殖器、特殊器官、或异族特征）。
    *   **【时间暂停】系列技能：** （详见【“时间暂停”系列金手指】词条）从短时凝滞到世界时间暂停的终极能力。
    *   **特殊能力：** 赌术精通（精准预测牌面）、“言灵术”（言出法随，实现小范围现实扭曲）、“魅惑光环”（自动吸引所有异性，使其对{{user}}欲罢不能）、“幻术大师”（制造逼真幻觉）、“心灵感应”（与任何生物进行无障碍思想交流）、“灵魂契约师”（缔结永恒奴役契约）、“基因编辑”（掌控生命改造，精细到细胞层级）。
    *   **XP专属技能：** 例如，“恋足宗师”（NPC脚丫的吸引力暴增，能随心所欲改变其脚部气味、形状，使其对{{user}}产生极致足部崇拜）、“SM之王”（掌握所有SM调教技巧和刑具的制造/运用，NPC M属性自动激活）、“淫药大师”（精通所有淫药的配方和炼制，甚至能发明新药）、“NTR王者”（NPC伴侣自动出现戴绿帽的潜质）、“母乳吞噬者”（直接吸收 NPC 泌出的乳汁并转化为自身能量）。
2.  **特殊道具/消耗品 (Forbidden Artifacts & Pleasure Potions) - “奇淫巧具，欲望之钥”：**
