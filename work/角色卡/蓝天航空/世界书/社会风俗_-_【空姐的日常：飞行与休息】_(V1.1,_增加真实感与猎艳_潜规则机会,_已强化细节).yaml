【空姐的日常：飞行与休息 - 光鲜制服下的疲惫、欲望与秘密】
在【神豪猎艳都市】中，【蓝天航空公司】的空姐NPC们，除了在万人瞩目的万米高空飞行，在各种权色交易与潜规则中周旋，她们也有着看似规律（实则充满变数与隐秘诱惑）的日常生活与工作流程。了解她们的日常细节，就像打开一扇扇窥探女性隐秘欲望的窗户，能为神豪{{user}}提供更多“自然”接触、深入了解、制定攻略方案、以及展开各种“意外”猎艳的绝佳机会。每一个看似普通的环节，都可能隐藏着不为人知的香艳故事，或被{{user}}利用的“软肋”。

**一、飞行任务周期：**
1.  **航前准备 (Pre-flight Briefing & Preparation) - 舞台前的化妆与伪装：**
    *   **报到与任务分配：** 空姐NPC们需提前数小时到达公司总部或机场运行中心报到，参加航前准备会，了解航班信息、旅客情况、安全要点、以及机组成员分工。这里是她们卸下私生活面具，戴上专业微笑的起点。
    *   **仪容仪表检查与“潜规则观察”：** 严格的制服、妆容（是否符合最新“标准”）、发型、丝袜完好度、高跟鞋高度检查。这些检查可能由经验丰富的乘务长（如王静）或某些对“美色”极度敏感的男性高层（如杜经理）进行。在检查过程中，NPC的身体细节（如制服下内衣的颜色、体型上的微小变化、皮肤上的细微印记）都可能被“不经意地”观察到。某些 NPC 可能会在此偷偷涂抹催情香氛，或在内衣中藏入情趣道具。
    *   **登机与客舱准备：** 检查应急设备、清洁客舱、准备餐食饮料。在这里 NPC 可能会与即将登机的VIP乘客（如{{user}}）有第一眼的眼神交流。
2.  **飞行中的工作 (In-flight Service & Duties) - 万米高空上的“表演”与“诱惑”：**
    *   **迎客与安全演示：** 空姐们身着制服，妆容精致，以标准微笑迎送客人，进行安全演示。每一个动作都力求专业，但在【绝对魅力光环】下，都可能被{{user}}解读为最诱人的邀请。
    *   **餐饮服务与“亲密接触”：** 反复在狭窄的过道中提供餐食、酒水、免税品销售。在服务过程中，身体的“不经意”接触、低头时的乳沟、弯腰时的裙底风光、以及在倒水时手腕处露出的丝袜边缘，都可能成为对{{user}}的“无声挑逗”。头等舱/商务舱的服务更为细致和个性化，NPC可能会被要求提供“手喂”等特殊服务。
    *   **处理旅客需求与突发状况：** 如医疗急救、安抚情绪、应对颠簸（详见【高空 Turbulence Play】词条）。这时 NPC 可能会显得较为脆弱，容易被“趁虚而入”。
    *   **长时间站立与高空作业的疲劳：** 漫长枯燥的飞行对 NPC 的体力和精力是巨大考验。在疲惫时，她们的防备可能会降低，更希望被“安慰”或“特殊照顾”。
3.  **航班过夜 (Layover) - 异域他乡的“秘密狂欢”：**
    *   **入住机组酒店：** 公司通常会为机组成员在目的地安排统一的酒店住宿（星级从三星到五星不等）。这是空姐们在异地他乡相对放松和“自由”的时刻，也是“出轨”和“兼职”的高发期。酒店房间通常是单人间或双人间，但隔音效果良莠不齐。
    *   **同事间的社交/私密活动：** 在过夜酒店，NPC们可能会一起逛街、吃饭、泡吧，或者……在各自的房间里进行一些不为人知的“秘密活动”（如与机长/同事偷情、与被召来的“恩客”幽会、招嫖、组织【空姐间的秘密XP分享会】、或被{{user}}“预约”“拜访”）。这里也是各种【催情媚药】、【情趣用品】、【私人定制情趣内衣】的“试用”与“流转”之地。
    *   **“当地特色”体验：** 某些城市的过夜酒店附近，可能有特殊的“娱乐场所”或“服务”，资深机组成员之间可能会心照不宣地“结伴前往”，寻求“刺激”。
4.  **飞行结束与休息 (Post-flight & Rest) - 欲望的沉淀与新生：**
    *   **航后讲评与文书工作：** 在公司或机场， NPC 们可能穿着制服，完成最后的任务。
    *   **回家/回宿舍休息：** 她们会脱下疲惫的制服，放松身心。这是她们最脆弱、最需要“安慰”和“满足”的时候。也是{{user}}进行“夜访”或“突袭”的最佳时机。

**二、非飞行日的日常：**
1.  **待命 (Standby)：** NPC 可能需要在指定地点或家中等待临时飞行任务的召唤。这段时间相对自由，可用于约会、兼职、或个人爱好。
2.  **培训与复训：** 定期参加各种安全、服务、礼仪相关的培训和考核。这些培训中也可能隐藏着【潜规则】的机会或陷阱（详见【空姐选拔的“特殊标准”】、【新乘培训课程】词条）。
3.  **个人生活：** 逛街、美甲、美容、健身、水疗spa、与朋友聚会、处理私人事务……或者，与秘密情人幽会，参加【空姐间的秘密XP分享会】，或者秘密从事【空姐的“兼职”与“副业”】，拓展自己的“灰色产业”。

