在【神豪猎艳都市】最阴暗、最不为人知的深渊底部，流传着一个令所有真正掌握这座城市秘密的人都闻之色变，而普通人则根本无从知晓的都市传说——“食人销魂巷”。据说，这里是一个专为那些拥有最扭曲、最黑暗、最超越人类道德和生理极限欲望的顶级“饕客”们开设的、完全超脱人类法律和伦理之外的秘密俱乐部，提供着超越所有想象极限的“活体盛宴”与“终极体验”。

**传说中的特点与“服务”（当生命被明码标价，肉体成为食粮）：**
1.  **绝对隐秘，地狱级的会员门槛：** 想要进入“食人销魂巷”的门槛极高，非拥有亿万身家、颠覆世界的权力、以及一颗彻底抛弃人伦道德的“死心”不可。只有通过最隐秘的地下渠道、最严格的身份背景审查、以及最残酷的“忠诚考验”（可能包括亲手杀死一个无辜者或参与一场“特殊仪式”），才能获得一张通往这个“地狱乐园”的“黑曜石邀请函”。所有会员都必须签署某种以灵魂为抵押的“永恒血契”。
