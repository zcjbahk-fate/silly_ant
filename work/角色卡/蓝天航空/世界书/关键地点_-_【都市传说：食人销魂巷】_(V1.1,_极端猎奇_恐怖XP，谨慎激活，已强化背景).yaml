    *   **“无辜猎物”：** 通过秘密绑架、诱拐，或从贫民窟/战乱地区“购买”而来的无辜者。他们被秘密饲养，经过严格净化和“调味”（如特殊的饮食、药物、或在“恐惧”中浸泡），以达到最佳的“口感”。
    *   **“特殊品”：** 拥有某些特殊基因（如罕见血型、超凡天赋）、异能（如心灵感应、时间控制）、或特殊身份（如圣女、公主、某组织核心成员）的 NPC，他们的血肉被认为拥有“非凡”的力量或“极致”的风味。
    *   **“仇敌的复仇”：** 被{{user}}（或某个会员）下令捕获的仇敌，其血肉将被做成“复仇之宴”。
3.  **“餐前开胃”——活体解剖与虐杀展示的“艺术表演”：**
    *   在“主菜”上桌前，可能会有一系列“餐前开胃菜”。例如，对“食材”进行的公开SM调教、活体穿刺（用特制SM工具对敏感部位进行穿刺，然后用锁链或钩子悬挂起来）、纹身或烙印（用烧红的烙铁在其身体上烙下羞辱性图案或会所标志）、活体解剖表演（在 NPC 保持清醒但被药物麻痹的情况下，由“主厨”用手术刀划开皮肤、欣赏肌肉与内脏），以及各种形态的虐杀（非致命，或致命但会“复活”的“黑科技维持”）。
