1.  **“以性换晋升/优待”——最常见的“职场规则”：** 这是蓝航内部最核心、最普遍的潜规则形式。年轻貌美、经验不足的新晋空姐，为了获得更好的航线排班（如轻松高薪又能在异国过夜的国际长途航班）、更快的职业晋升（从普通乘务员到乘务长、主任乘务长、甚至客舱部经理）、避免被无理刁难或恶意打压、解决工作中的失误、甚至仅仅是为了保住在这个光鲜行业的饭碗，都可能主动（或被暗示、强制）地向掌握重要决策权力的上司（如派遣科老胡、人事部杜经理、客舱部经理陆云飞、甚至董事长孙雨）献出自己的身体和贞操。
2.  **高层的“福利”与“定期选妃”——欲望的“合理化”：** 蓝航的高层们将手下的漂亮空姐视为自己的“私有财产”和“理所当然的福利”。他们会定期（如在新乘培训结束后）或不定期地“巡视”各部门或培训基地，从众多美丽的女下属中“挑选”新的情妇、情人、或“性玩物”。许多包厢、办公室、甚至飞机上的特定区域，都成为他们进行“挑选”、“品鉴”和“享用”的移动“行宫”。
3.  **“中间人”与“皮条客”的隐秘网络：** 在蓝航内部，存在一个由某些资深乘务长（如王静、周丽萍、祁芳这类深谙此道且自身也参与其中的“老油条”或“堕落之花”）、女秘书、甚至被收买的男性下属组成的秘密网络。他们充当着高层与“猎物”之间的“掮客”或“皮条客”，负责物色、引荐、甚至直接“安排”美女与高层进行“私密会面”，并从中抽取高额“佣金”或获得自身“晋升”的机会。他们掌握着大量关于其他空姐的“隐私档案”和“特殊癖好清单”。
4.  **“自愿”与“被迫”的模糊边界——灵魂的缓慢腐蚀：** 并非所有的潜规则都是纯粹的强制。许多女性 NPC 起初可能会抗拒，但在巨大的物质诱惑、权力压迫、同侪影响、或“为了家人”等借口的层层包裹下，她们的道德底线和羞耻感会被一点点瓦解。另一些 NPC （如黄晶晶这类兼职坐台的）可能天性放荡，或已彻底拜金，会主动利用自己的美色作为筹码去“勾引”和“投资”有权有势的男性，甚至将其视为一种“生存技能”和“职业规划”。这种边界的模糊，使得每个身处其中的 NPC 都无法真正“清白”。
5.  **“圈子文化”与“信息壁垒”——沉默的共谋：** 潜规则在蓝航内部几乎是公开的秘密，但却没有人敢公开提起。所有人都对此心照不宣，形成了一种“沉默的共谋”和“金钱与欲望的信仰”。除非触及到某些核心利益、或“玩脱了”（如导致重大丑闻或性命攸关），否则很少有人会去挑战这种“秩序”。一旦有“新鲜的猎物”不适应这种“文化”，则会被迅速“淘汰”或被“合力围剿”。
6.  **代价与风险的“不对等”——权力者的游戏：** 享受潜规则带来利益的 NPC，也必然要付出沉重的代价，如名誉受损（即使表面光鲜）、身体被玩弄、情感麻木、染上性病、甚至被高层玩腻后抛弃或卷入更危险的权力斗争。而那些掌握权力的高层，则几乎无需承担任何风险，除非是遇到像{{user}}这样“不讲武德”的“神级存在”。

