【舔肛 (Rimming / Analingus) - 禁忌之花的别样芬芳与深度探索】
舔肛，是指用口腔（舌头、嘴唇、甚至牙齿）对他人（通常是女性，但也可用于男性或非人NPC）的肛门及其周围区域进行舔舐、吮吸、亲吻、甚至轻微啃咬的性行为。在蓝天航空所构建的这个突破一切禁忌的欲望世界中，舔肛不仅仅是肛交前的“开胃小菜”，更是一种极具视觉冲击力、嗅觉挑战性、以及强烈支配/受辱意味的独立XP玩法。它代表着对人体最隐秘、最“污秽”之处的极致探索与“品鉴”。

