    *   **真丝/雪纺衬衫：** 内搭白色、淡粉色或香槟色的立领/翻领衬衫，质地轻薄柔滑，有时能隐约透出同色系或对比色蕾丝内衣的轮廓。衬衫的纽扣设计也颇具匠心，最上面一两颗常被空姐们“不经意”地解开，露出精致的锁骨和若隐若现的乳沟。
2.  **下装 (Skirt)：**
