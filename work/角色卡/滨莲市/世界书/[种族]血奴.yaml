  血奴:
    大类定位: 西洋租界秘仪与古老始祖母神真血演化的不死血族，全员女性（唯有女性能凝聚血髓）。普通血裔极度畏光，夜晚拥有极速与血能爆发；纯血贵胄在日光下不会死亡但超自然能力大幅削弱。

    猩红贵胄:
      种族名: 血裔系 · 猩红贵胄（纯血主母）
      区域: 青梧区半山独栋庄园、滨莲大教堂地下密室、永夜会馆顶层
      成因:
        先天: 十九世纪西洋租界时期移居滨莲的纯血吸血鬼家族，古老始祖母神血脉在隐秘庄园中代代自然繁衍传承。
        后天: 无后天形成（纯血始祖贵胄无法通过后天转化产生）。
      能力:
        - 日光抗性（日光大幅削弱但不死）: 白天在日光下不会灼烧化灰，但超自然血能全面沉寂，体质退化为虚弱无力的柔弱女性；
        - 夜晚暗夜主宰: 夜晚拥有音速级移动突进、血雾化隐匿与暗影穿梭；
        - 血脉绝对压制: 对所有下位血裔拥有绝对的心智支配与生杀大权；
        - 咬合共感 (Bite Symbiosis): 吸咬猎物颈项时能与其完全共享感官与快感。
      外观特征: 完全女性人形。容貌艳丽绝伦且冷酷，肌肤惨白如大理石并泛着血玉光泽。身着华贵繁复的暗红或纯黑哥特蕾丝礼服，猩红眼眸，犬齿尖锐小巧，举手投足尽显上位者威仪。
      性爱特点:
        - 咬合与射精共鸣: 尖牙刺入男性颈动脉吸血的同时，男方射精快感与女方吞咽热血的充盈感完全互通共鸣；
        - 白日虚弱与夜晚女王的反差: 白天在日光照耀的房间里，她是手无缚鸡之力、任由主人随意摆弄欺凌的绝美娇弱贵妇；而在夜晚，她则是高傲强横、跨坐狂榨的暗夜女皇。
      意识保留程度: 100%+（掠食超越型）。生前所有记忆与顶级智商100%保留并被血能大幅强化。自我认知彻底超越人类世俗道德，视凡人如牛羊家禽，拥有绝对的主宰者心理。

    渴血新姬:
      种族名: 血裔系 · 渴血新姬（初拥游离态）
      区域: 莲心区酒吧街暗巷、锈港夜市特货区、兰庭医院地下血库
      成因:
        先天: 年轻女孩在深夜被游荡血族袭击吸血致死，残存微量天然血毒未被完全代谢，死后数小时自然尸变转化。
        后天: 黑市地下诊所向濒死少女体内注射人工提纯的“S-Vampire 病毒血清”，强行人工诱导初拥。
      能力:
        - 极度畏光（致命弱点）: 皮肤接触日光即刻起水泡焦黑溃烂；
        - 夜晚血影突进: 夜间短距爆发力惊人，可在数米内瞬间突进扑倒猎物；
        - 痛觉钝化: 受到常规物理打击几乎无痛感反应；
        - 热感追踪: 依靠红外热感精准感知活人血管与性器的充血位置。
      外观特征: 完全女性人形。保留现代时尚少女/学生外貌，身穿常服。面容苍白，瞳孔在微光下泛着淡红，嘴唇红润，体表温度随饥饿程度剧烈波动，神情带着惊恐与渴望。
      性爱特点:
        - 体温与润滑两极化: 空腹极度饥饿时体温仅有20°C，穴道干涩冰凉；一旦被灌入鲜血或滚烫阳精，体温在数分钟内飙升至39°C，穴道内壁化作滚烫湿绞的熔炉；
        - 被动索取狂热: 在被吸血或被内射时会产生强烈的内啡肽高潮，身体不可自控地主动迎合摆动。
      意识保留程度: 85%（人格撕裂型）。完整保留人类时期的记忆、亲友羁绊、生活习惯与道德羞耻心。理智极度渴望做回正常人，但肉体却被渴血与索精欲望支配。在性交时往往一边哭泣道歉（“对不起…我停不下来…”），一边发狂般死死夹住对方榨精。

    沉眠干姬:
      种族名: 血裔系 · 沉眠干姬（脱水血魅）
      区域: 青龙陵深山密林荒坟、黑市跨国走私集装箱密闭舱
      成因:
        先天: 古老血族因意外被封入地下断血数百年，肉体水分与血液彻底耗尽，自然陷入深层假死干瘪状态。
        后天: 黑市利用抽水设备人工排干女血族体液，注入防腐惰性气体，封入真空玻璃展柜中作为顶级艺术品封藏。
      能力:
        - 精血海绵复苏: 能以极快速度将吸收的纯阳精液转化为自身活化血能；
        - 次声波尖啸: 受惊或发狂时可发出微弱次声波震慑周围目标；
        - 干瘪避光伪装: 静止时与普通干尸无异，完全屏蔽生命与灵能探测。
      外观特征: 完全女性人形。形体干瘪轻盈如枯木雕塑，皮肤紧贴骨骼呈现灰褐色，双眼紧闭，犬齿外露，宛如沉睡的异域妖姬干尸。
      性爱特点:
        - 精血水化复苏 (Essence Rehydration): 冷水或普通血液无法唤醒她，唯有将滚烫纯阳之精直接射入其干涸子宫深处；
        - 海绵吸水丰润: 接触精液后，干瘪的皮肉如海绵吸水般在数分钟内迅速饱满丰盈，从干尸蜕变为绝美肉体，下体紧窄如初生，疯狂锁住施精者。
      意识保留程度: 0% → 90%（精血唤醒型）。初醒瞬间意识为0，纯凭吸取活人体液的本能行动；随着多次精液深注，生前作为贵族千金的优雅记忆如潮水般阶梯式复苏，从狂乱野兽转变为高傲中带着顺从的侍寝妖姬。
