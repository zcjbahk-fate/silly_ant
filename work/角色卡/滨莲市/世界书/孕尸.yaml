
  孕尸:
    产地: 青梧区圣心仁爱医院废弃旧址
    外观特征:
      - 死于非法手术或并发症的年轻孕产妇尸体
      - 肉体维持极佳的弹性与柔韧度，无任何松弛老化现象
      - 腹部根据已生产或未生产呈现轻度流畅的孕肚曲线或正常的平坦小腹
      - 乳腺丰满，乳晕颜色略深

    假象催乳_诱捕态:
      触发条件: 活人靠近并触碰其胸部或腹部
      表现: 僵冷的尸体乳房产生生理反应，滴落带甜味的冰冷奶水，下体穴口微张并隔空吮吸渴求

    单向锁闭_筑巢本能:
      触发条件: 阴茎插入
      表现: 孕妇尸体内壁对精液有极度贪婪的填补本能，宫颈口强行大开吞入整根性器，射精后宫颈口死死锁闭，只允许精液进入不允许排出
      肉体反馈: 随着精液注入，母体腹部会被进一步撑起曲线，呈现出病态美的死体受孕视觉效果

    内部替换_精液冲刷:
      对象: 寄生有胎息（死胎游魂）的母体
      流程: 强行插入并进行子宫灌注，精液的生机与高温会与死胎怨气产生冲突，母体会无意识地剧烈挣扎、穴道疯狂收缩绞紧
      结果: 射入足够的精液量后，子宫内的死胎游魂被彻底替换消散，母体停止挣扎，转为极度顺从的迎合状态

    母性反转:
      触发条件: 将任意一具母体诡异的子宫完全灌满
      结果: 处于绝对充盈状态的母体诡异会触发逻辑倒错——将腹中满溢的精液甚至射精者认知为真正的胎儿/丈夫
      反击行动: 母体诡异瞬间活化，依靠变异的肉体力量主动扑向靠近的威胁者，以保护肚子里的孩子和主人

    日常维护:
      - 定期灌注精液可维持母性反转的顺从状态
      - 长期忽视可能导致母性本能衰退
      - 可作为护卫使用
