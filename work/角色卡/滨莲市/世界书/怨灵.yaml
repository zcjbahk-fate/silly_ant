  怨灵:
    大类定位: 滨莲市最凶险、最不可控的纯天然死煞派系，由人类女性在死前遭受极端的残虐、背叛、绝望、冤屈或酷刑，七魄与灵煞强行固化在尸身上自然化煞而成。形态虚实由心（平时穿墙遁影，交合触碰时化为真实极寒肉身）；绝对无法后天改造；唯有出示其生前特定因果遗物破除心防，并以至刚至阳之精深注子宫破除体内阴煞，方能达成契约驯服。

    渊怨伽姬:
      种族名: 怨灵系 · 渊怨伽姬（爬行死煞）
      区域: 老城区封条凶宅阁楼、废弃民居楼梯拐角、永夜会馆深层暗井
      成因:
        先天: 年轻女性在密闭室内遭遇极度残忍虐杀、家暴分尸或被推入深井绝望窒息，死前怨气凝结不散化为永恒地缚凶灵。
        后天: 无法后天改造（任何手术刀接触均会导致主刀法医暴毙）。
      能力:
        - 空间与重力扭曲（壁面潜行）: 关节可180度无声反折，以四肢着地的极度诡异姿态在天花板、墙壁及被褥深处极速爬行；
        - 咒怨领域（心理致幻）: 喉部持续发出令人心悸的“格格格…”断气声，靠近者陷入强烈窒息感；
        - 发丝缠杀（怨发操纵）: 长发可瞬间暴涨数十米，将猎物四肢死死勒紧拖入黑暗。
      外观特征: 完全女性人形。惨白如纸的皮肤布满青灰淤痕，一头浓密漆黑的湿长发垂落覆面，仅露出一双纯黑怨毒的眼眸。身着染血白裙，动作扭曲断续，带着强烈的恐怖谷冲击。
      生前因果遗物（收容条件）: 取决于其生前被害过往（如：死前死死攥在掌心的带血婚戒、藏在阁楼夹层中的旧八音盒、女儿生前的乳牙发夹等）。
      性爱特点:
        - 反折体位的极度柔韧: 关节无视人体极限，能在四肢反曲倒悬的姿态下交合；
        - 喉音断气娇喘: 穴道冰凉湿滑如深井苔藓，被深入贯入时，喉中惊悚的“咯咯”断气声异化为断断续续的甜腻哭喘；
        - 发丝紧缚与强制锁精: 在男方即将射精时，湿长发会自动缠紧男方的四肢与脖颈，死死按在自己腹上疯狂榨精。
      意识保留程度: 10%（永恒怨咒型）。生前人类理智几乎被惨死痛苦占据。唯有在触碰生前因果遗物并被至阳精液反复深度灌注压制时，长发才会散开，露出生前清秀绝美却满是泪痕的面容。

    冥嫁红煞:
      种族名: 怨灵系 · 冥嫁红煞（绝艳怨妻）
      区域: 青龙陵偏僻野庙、古老宗祠地下密室、黑市冥婚买卖暗室
      成因:
        先天: 生前被强迫配阴婚、活活封入棺木陪葬，或身穿大红嫁衣含恨自缢的新娘。强烈的“未结姻缘怨念”化作红煞。
        后天: 无法后天改造。
      能力:
        - 红绫锁魂: 操控三丈血色红绸，能瞬间禁锢敌人并绞杀生机；
        - 七窍血泪煞: 凝视对方可令其气血倒流；
        - 阴阳结契护夫: 一旦被真正的活人男子出示定情因果遗物并明媒正娶（肉体贯入圆房），红煞化为绝对霸道的“护夫厉鬼”，斩杀一切靠近主人的敌人。
      外观特征: 完全女性人形。容貌凄艳绝美，身披残破刺金大红凤冠霞帔，头戴半遮面的染血红盖头，脚踩三寸红绣花鞋。足不沾地，漂浮于离地三寸之处，周身弥漫着蜡烛、线香与尸冷气息。
      生前因果遗物（收容条件）: 取决于其生前被逼婚殉葬的真实过往（如：出嫁前母亲偷偷塞给她的生辰八字绝笔、当年与真心爱人定情却被折断的半截木梳、染血的冥婚纳吉礼书等）。
      性爱特点:
        - 红盖头下的阴婚洞房: 掀开红盖头的瞬间，美艳煞白的脸庞上两行血泪滑落；洞房仪式中，阴风呼啸，蜡烛自燃；
        - 凤髓肉环极紧吸附: 穴道内壁带有古代房中秘术般的极度紧致与多层肉环吸附，初入如刺冰针，随着摩擦生热化作滚烫吸髓的漩涡；
        - 死生相随的娇啼侍寝: 在被男方强力征服并射入炽热精阳后，煞气消散，发出极度娇羞却带着幽怨的古代贵妇承恩之音：“夫君…今夜既已圆房…生生世世休想休弃妾身…”。
      意识保留程度: 80%（执念怨偶型）。完整保留生前被逼婚殉葬的凄惨记忆与大家闺秀仪态。对“背叛与抛弃”极度敏感，对真正占有并善待她的“夫君”展现出令人窒息的病态占有欲与极度依恋。

    寒渊溺姬:
      种族名: 怨灵系 · 寒渊溺姬（深潭水鬼）
      区域: 莲江回水湾乱石滩、白沙湾沉船残骸底舱、锈港废弃积水船坞
      成因:
        先天: 年轻女子被沉塘、投江或困于密闭水舱绝望溺毙，死后七日尸身不沉，怨魂化入极阴寒水凝结为索命水鬼。
        后天: 无法后天改造。
      能力:
        - 深潭水煞拖拽: 在水域或潮湿环境中力大无穷，长发可化作水草将重物拖入水底；
        - 极寒水膜护体: 体表覆盖一层零下数度的深渊极寒水膜，免疫火烧与物理切割；
        - 肺腔喷涌与水窒息: 能引动活人体内的水分逆流，制造溺水窒息效果。
      外观特征: 完全女性人形。全身湿漉冰冷，皮肤呈现病态的剔透冷白，长发如漆黑水草般黏连在胸脯与腰间。水滴不断滴落，双眸深邃如幽潭，散发着湿冷清冽的江水水汽。
      生前因果遗物（收容条件）: 取决于其溺亡原因（如：沉塘时死死缠在脚踝上的生锈铁索残环、落水前未曾寄出的防水手写信、在船舱溺毙时挂在胸前的吊坠等）。
      性爱特点:
        - 深渊旋涡真空绞吸: 穴道内壁冰凉滑腻，更具备极强的水流负压吸力，每一次抽插都伴随着水声翻涌与将龟头往死里吞咽的狂暴负压；
        - 被填满时的喘息获救感: 因为生前死于肺部进水的窒息，当阳精如热流般灌入其子宫深处时，她会产生“终于浮出水面呼吸到新鲜空气”的极致快感，身体剧烈抽搐战栗，紧紧锁住男方不放。
      意识保留程度: 35%（窒息执念型）。主要保留溺亡时的恐惧、窒息与对温暖人世的贪恋。只要出示因果物被热液填满抱在怀中，便会极度柔顺温存。

    毁容怨姬:
      种族名: 怨灵系 · 毁容怨姬（裂相怨魅）
      区域: 废弃医美整形医院残垣、剧院地下更衣室、化妆镜后的阴暗夹层
      成因:
        先天: 极度绝美之人遭遇嫉妒毁容、硫酸泼面、剥皮或烈火焚面惨死，其对“绝美容颜”的疯狂执念与对施暴者的刻骨仇恨凝结为极凶裂相怨魅。
        后天: 无法后天改造。
      能力:
        - 精液滋养皮囊（绝美伪装态）: 当体内吸收的滚烫精液充盈充足时，面容与肌肤会维持在生前最巅峰的倾城绝色状态，五官精致如仙，毫无一丝瑕疵；
        - 裂相本相展露（极凶战斗态）: 当体内精液耗尽、或受到激怒释放超自然灵煞攻击时，伪装瞬间碎裂，展露出半张脸血肉翻卷、白骨森森、嘴角撕裂至耳根的狰狞毁容本相；
        - 怨煞镜像剥离: 能透过镜面无声穿梭，挥动如剃刀般锋利的骨刃指甲。
      外观特征: 完全女性人形。身穿性感情趣睡袍或残破晚礼服。在精液充盈时拥有滨莲市最顶级的人间尤物容颜；在精液干涸时半边脸倾城绝色、半边脸如被烈火烧熔般血肉模糊，带着极具视觉冲击力的凄厉反差。
      生前因果遗物（收容条件）: 取决于其生前容貌与被害节点（如：毁容前最后一次登台演出的获奖旧相片、初恋送给她的未开封古董口红、行凶者作案时遗落的带血碎镜片等）。
      性爱特点:
        - 为了维持美貌的疯狂索精: 深知唯有男性的阳精能够维持自己的绝美容颜，对精液有着病态的贪婪与谄媚，会极尽所能施展最高超的口技与骑乘取悦主人；
        - 濒临裂相时的慌乱与被动受虐: 当感到体内精液快要耗尽、面容即将开始崩解时，会极度惊恐慌乱地捂住脸哭求主人：“不要看现在的我…求你快射给我…把精子全给我…”，此时内壁会因恐慌而产生极致的痉挛高潮吸附。
      意识保留程度: 65%（容貌执念型）。完整保留生前作为绝色美女的自恋、骄傲与被毁容时的刻骨剧痛记忆。对夸赞其美貌的主人产生极度依赖，对嫌弃其丑陋者则会瞬间化作厉鬼割断其喉咙。

    胎煞怨母:
      种族名: 怨灵系 · 胎煞怨母（产难死灵）
      区域: 青梧区圣心仁爱医院废弃旧址、老城区废弃妇产科停尸房
      成因:
        先天: 年轻代孕产妇在难产或非法药物引产中母子双亡大出血猝死，母体咽气但腹中死胎化作极凶“胎息婴煞”，母子双魂互锁，在阴煞催化下自然尸变为极凶怨母。
        后天: 无法后天改造。
      能力:
        - 婴煞啼哭震慑: 腹中死胎怨魂可发出穿透灵魂的精神尖叫，令周围活人头痛欲裂、丧失反抗能力；
        - 虚孕单向锁宫: 宫颈具备天然阴煞阀门，精液只进不出，腹部随精液注入量膨胀隆起；
        - 催情阴奶分泌: 揉捏乳房可刺激乳头滴落带有极强催情与致幻效果的冰冷甜奶；
        - 母性反转狂暴守护: 子宫被精阳灌满净化后，触发逻辑认知倒错，化身狂暴护主母煞，力量翻倍撕碎一切敌人。
      外观特征: 完全女性人形。腹部维持着流畅优雅的6-8个月孕肚曲线，乳房丰满充盈散发奶香，肌肤白皙柔韧，面容在凶厉与慈爱母性之间反复切换。
      生前因果遗物（收容条件）: 取决于其难产与死胎悲剧（如：死前亲手为孩子织好的虎头小红鞋、沾染羊水与血迹的纯银长命锁、最后一张盖有病危章的B超检查单等）。
      性爱特点:
        - 初入婴煞抗拒到精阳净化: 初期交合时受腹中死胎怨气驱使会产生剧烈抗拒与穴道疯狂绞咬；随着滚烫精阳如热流般灌满子宫，死胎怨气被彻底净化消散，母体发出解脱的甜美娇喘瘫软顺从；
        - 催乳与怀抱哺乳侍寝: 极其适合怀抱哺乳姿势，被抽插时会主动将丰满乳房塞入男方口中，下体同时分泌湿滑爱液配合抽动。
      意识保留程度: 40%（母性倒错型）。生前的人际关系记忆淡忘，大脑被“母亲”的本能占据。在子宫被灌满后将主人判定为骨肉/丈夫，展现出窒息般的偏执溺爱与绝对服从。
