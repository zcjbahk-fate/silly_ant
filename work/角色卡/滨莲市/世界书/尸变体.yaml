
  尸变体:
    产地: 黄泥湾七号站（S病毒研究设施）
    来源: 全部由女性实验体经S病毒长期浸染异变而来，外观保留女性躯体基本结构和面部轮廓

    分类与特征:
      小怪级:
        游丝体:
          - 体型纤细，四肢比例拉长，手指延伸为角质爪
          - 皮肤灰白，残存发丝硬化为银灰针状，面部保留女性轮廓
          - 能力：高速爬行，可附着墙壁天花板，角质爪连续抓击
          - 弱点：依赖听觉定位，视力退化
        膜甲体:
          - 匀称女性体态，全身覆盖三毫米厚琥珀色半透明角质膜
          - 膜下乳房轮廓和肌肉纹理可透视，面容被封在膜内但五官清晰
          - 能力：冲撞抱摔，膜甲硬度高，抱住后不松手
          - 弱点：腋下、腹股沟、膝窝处膜层较薄
        咬合体:
          - 正常女性躯干四肢，颈部肌肉膨大至两倍，下颌扩张多生两排齿列
          - 上半脸柔美与下半脸狰狞形成反差
          - 能力：咬合力极强，锁咬后不松口，可四足奔行
          - 弱点：锁咬状态下无法防御侧后方攻击

      精英级:
        丝驭者:
          - 完好女性形态，月白色皮肤带淡青血管纹
          - 头发为核心异变——发量五倍于常人，长三到六米，可鞭击、缠绕、穿刺
          - 功能：区域控制型，以自身为圆心约六米半径发丝帘幕
          - 弱点：发根区域（头皮和后颈）
        融壁者:
          - 上半身完好女性形态，浅灰色皮肤
          - 腰以下消融为半透明血浆色胶状体，可融入墙壁地面天花板后任意位置出现
          - 功能：伏击型，胶状下体可凝聚触肢打击或包裹吞噬，表面微弱酸蚀
          - 弱点：上半身头颈是唯一致命点，火焰对胶状体有效

      Boss级:
        蛹后:
          - 上半身接近完好的人类女性躯干，皮肤灰紫色带光泽，面容保留五官但表情僵滞
          - 下半身与直径约两米的球形生物质基座完全融合
          - 功能：指挥型+产卵型，释放信息素控制同层小怪，基座触手四到六条自卫，球囊可孵化游丝体补充兵力
          - 弱点：腰臀融合带，切断后躯干失去对基座控制
        源母:
          - 核心体为从地面有机质基座中生长出的半身女体，保留完整人类女性躯干结构
          - 整个房间即其延伸体，地面墙壁天花板均覆盖有机质肉膜
          - 功能：持续孵化小怪、触手网络全室包抄、液态胶状团块远程骚扰、高浓度信息素导致判断力下降
          - 弱点：核心体头颈部，破坏后整个母巢数小时内坏死

    征服机制:
      适用范围: 精英级及以上尸变体，小怪级神经退化过度不可征服
      条件: 战斗中将目标压制至无力抵抗但未杀死
      手段: 压制状态下直接发生性行为，通过反复交合建立本能层面的服从印记
      原理: 尸变体的神经系统对强烈的生物信号（体温、体液、持续物理刺激）会形成依赖性锚定

    征服体能力转化:
      丝驭者:
        战斗: 发丝从武器转为可控触肢，可指挥其缠绕、束缚、鞭打指定目标
        色情: 发丝包裹阴茎套弄、多根同时刺激多个敏感点、发梢探入马眼旋转挑逗、全身悬吊束缚后自主取精
        特性: 服从度高时发丝从粗硬变为柔韧丝滑
      融壁者:
        战斗: 胶状下体转为半液态护盾或侦查触肢
        色情: 胶质全身包裹，内部自动生成吸附结构套弄阴茎，多点同时刺激全身，包裹状态下无法自主抽出只能被动承受节奏
        特性: 胶质包裹时内部温度和粘稠度随融壁者兴奋程度变化
      蛹后:
        战斗: 基座触手转为防御辅助，可指挥巢穴范围内的小怪级尸变体
        色情: 多触手同时控制力度角度服务，球囊分泌温热润滑液，基座平台柔软温热可作为活体床铺
        特性: 征服蛹后等于获得一个固定据点，巢穴内小怪级尸变体随之被动服从
      源母:
        战斗: 母巢区全域有机质肉膜均可控制，触手网络可执行任意复杂的束缚和刺激组合
        色情: 整个房间即活体性爱空间，全域触手多功能服务、肉膜床、包裹式、温度控制
        特性: 征服源母等于接管整个母巢区

    反噬机制:
      触发: 服从度极低，或主人在征服体附近处于虚弱状态（重伤、昏迷、极度疲惫）
      表现: 征服体主动对主人使用异变能力进行强制性交——不是攻击，是本能驱动的榨取行为
      具体:
        丝驭者: 发丝束缚全身反复取精直到脱力
        融壁者: 胶质完全包裹不允许挣脱直到自行满足
        蛹后: 触手固定在基座上持续刺激
      结果: 不会受到致命伤害，反噬后服从度不归零但需要重新建立信任

    感情培养:
      初始: 刚征服时仅接受简单指令，对主人保持警惕
      提升: 长期相处、定期喂食（微量S病毒营养液维持活性）、频繁身体接触
      上限: 高度服从但保留自主本能，不会变成完全无意识的傀儡
      衰退: 长期忽视或粗暴对待导致服从度下降

    体液价值:
      - 尸变体体内的变异体液含有不同浓度的S病毒降解产物和异变生物活性物质
      - 体液浓度与尸变等级正相关：小怪级稀薄，精英级中等，boss级浓厚
      - 体液在击杀后随躯体降解一同流失，完整回收需要在击杀后尽快用容器抽取
      - 回收越完整，后续可用于提纯、研究、改造辅助药剂的原料越充足

    日常维护:
      - 需定期喂食微量S病毒营养液维持活性
      - 频繁身体接触提升服从度
      - 长期忽视导致服从度下降甚至触发反噬
      - 小怪级无法征服，击杀后回收体液和躯体作为素材
