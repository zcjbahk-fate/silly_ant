
  僵尸:
    产地: 青龙陵景区地下层
    外观特征:
      - 皮肤呈青白色，体温恒定于环境温度约摄氏四度
      - 身上贴附黄色符纸，位置包括双眼、口部、乳头（左右各一）、小穴、后庭，共计七张
      - 古尸为唐代殉葬宫女侍女，穿着残破唐代服饰残片或全裸，符纸笔迹为唐代书法风格
      - 新尸为现代失踪女性（游客、探险者、夜间闯入的主播等）

    符纸封印系统:
      封印效果:
        眼符: 封住视觉，僵尸无法主动追踪目标
        口符: 封住声音和口腔活动，无法咬合或发声
        乳符: 形态接近帘状，随摆动容易露出乳头，封住胸部敏感度，揭开后乳头变得极度敏感
        穴符: 形态接近帘状，随摆动容易露出穴口，封住小穴，揭开后穴道恢复活性，内壁会主动蠕动吸附
        肛符: 形态夹进臀肉，紧贴勾勒双腿之间和腹股沟形状，封住后庭，揭开后括约肌恢复活性
      揭符效果:
        - 每揭下一张符，对应部位解封，可被使用
        - 同时该部位获得有限的自主活动能力——揭眼符后眼球能追踪活人，揭口符后能发出呻吟，揭穴符后穴道会主动夹紧
        - 揭下的符纸可收入随身物品，成为可转移使用的道具
        - 符纸一旦从僵尸身上揭下，该僵尸无法再生成新的符纸
      危险递增:
        - 揭符越多，僵尸的自主性越强
        - 全部揭除后，僵尸将完全自主化，会主动追逐活人索取精液
        - 自主化的僵尸力量远超常人，且不知疲倦

    攻击性机制:
      未交配状态: 尚未被揭符插入交配的僵尸具有攻击性，会主动攻击感知范围内的男性
      驯服条件: 阴茎插入任意穴道后，僵尸立即失去攻击性，进入顺从的无力尸体状态，会被动配合抽插和姿势调整
      状态固化: 一旦被插入驯服，该僵尸永久失去对该男性的攻击性，但对其他未交配过的男性仍保留攻击本能

    认主跟随机制:
      触发条件: 揭下僵尸身上任意一张符纸
      效果: 该僵尸自动认定揭符者为主人，会跟随主人移动，可被带出副本
      跟随表现: 会自动跟在主人身后，记住主人的气息，无论相隔多远都能感知主人位置

    回家榨精机制:
      触发条件: 将认主的僵尸带回现实居所，但将3张以上的符纸不贴回去
      表现形式: 主人回家的瞬间，未贴符的僵尸会立即袭击，方式为强制骑乘、口交、或用解封的穴道强行套住阴茎
      榨取强度:
        - 一至两张符未贴：无行动
        - 三张以上未贴：温和索取，可以承受
        - 全部七张未贴：凶猛榨取，不停歇地榨取直到贴符或昏厥
      规避方式: 不要摘掉太多符纸，或每次回家先满足僵尸的性欲

    符纸道具用途:
      使用方式: 贴在任意女性对应部位上
      使用效果: 被贴符的尸体该部位进入封印状态，获得与副本僵尸相同的特性——贴符时静止，揭符后该部位恢复活性
      特殊用途: 可用于其他活体女性转化为僵尸

    日常维护:
      - 避光密封存放即可，不腐败
      - 阳光直射不会造成消散，但会导致符纸褪色失效
      - 通过贴回符纸数量控制其活跃程度
