              可见: false

      - 名称: zod
        id: 70edd0c0-5425-49bf-b210-a095e8a29d7c
        启用: true
        类型: 脚本
        内容: |
          import { registerMvuSchema } from "https://testingcf.jsdelivr.net/gh/StageDog/tavern_resource/dist/util/mvu_zod.js";

          // 订单对象 schema
          const OrderSchema = z.object({
            来源世界: z.string().prefault("未知"),
            套餐名: z.string().prefault("未知"),
            套餐价格: z.coerce.number().prefault(0),
            服务状态: z.string().prefault("服务中"),
            好感度: z.coerce.number().prefault(50),
            兴奋度: z.coerce.number().prefault(0),
            性格类型: z.string().prefault("未知"),
            当前姿势: z.string().prefault("站立"),
            内心想法: z.string().prefault("无"),
            服装: z.object({
              上装: z.string().prefault("未知"),
              下装: z.string().prefault("未知"),
              内衣: z.string().prefault("未知"),
              丝袜: z.string().prefault("无"),
              鞋子: z.string().prefault("未知"),
            }),
            身体特征: z.object({
              罩杯: z.string().prefault("未知"),
              乳房形状: z.string().prefault("未知"),
              姿势描述: z.string().prefault("未知"),
              私处描述: z.string().prefault("未知"),
            }),
            性经验: z.object({
              处女: z.string().prefault("否"),
              性伴侣数量: z.coerce.number().int().prefault(0),
            }),
            服务统计: z.object({
              性交次数: z.coerce.number().int().prefault(0),
              下单次数: z.coerce.number().int().prefault(1),
            }),
          }).transform(data => {
            data.好感度 = _.clamp(data.好感度, 0, 100);
            data.兴奋度 = _.clamp(data.兴奋度, 0, 100);
            if (data.服务统计) {
              data.服务统计.性交次数 = Math.max(0, data.服务统计.性交次数);
              data.服务统计.下单次数 = Math.max(0, data.服务统计.下单次数);
            }
            if (data.性经验) {
              data.性经验.性伴侣数量 = Math.max(0, data.性经验.性伴侣数量);
            }
            return data;
          });

          // 主 schema
          export const Schema = z.object({
            经济: z.object({
              账户余额: z.coerce.number().prefault(5888),
              累计消费: z.coerce.number().prefault(0),
            }).transform(data => {
              data.累计消费 = Math.max(0, data.累计消费);
              return data;
            }),

            系统: z.object({
              当前场景: z.string().prefault("未指定"),
              多人服务: z.boolean().prefault(true),
            }),

            当前订单: z.record(
              z.string().describe("角色名"),
              OrderSchema
            ).prefault({}),

            历史角色: z.record(
              z.string().describe("角色名"),
              OrderSchema
            ).prefault({}),
          });

          $(() => {
            registerMvuSchema(Schema);
          });

