
  异常体:
    产地: 8号出口（地铁空间异常）
    外观特征:
      - 全部为女性外表，年龄跨度青少年到中年
      - 各自独立的外貌身材穿着，按角色生成规则完整展开
      - 存在不易察觉的异常标志：体温偏低、眨眼频率不对、呼吸时胸腔不起伏、影子方向错误等
      - 行为分类：被动型（坐着靠墙蹲角落）、主动型（搭话触碰递物品）、诱导型（肢体暴露性暗示）

    血标记:
      方式: 该实体血液进入口部（如咬破皮肤、舔血）
      血液特征: 异常体的血不是正常的铁锈味，每个实体的血味独特——可能是冰凉的甜腻、温热的金属电解感、粘稠如稀蜂蜜带花粉腐殖土气息等
      标记效果:
        - 被标记的实体自动跟随身后
        - 跟随状态的实体不受8号出口规则约束
        - 走出出口门时，所有被标记的实体自动跟随离开
      标记数量: 无上限，但每标记一个会在副本内触发敌意累积

    猎获物特性:
      带出后状态:
        - 有自主行为能力，极低智能——能回应简单问句（点头摇头、单词短语）、执行简单指令（站立、坐下、跟随、张嘴、分腿）、发出情绪反应（舒适时轻哼、不适时皱眉）
        - 体温约三十度，无心跳，无自主呼吸，瞳孔对光有微弱反应
        - 肌肉弹性和触感接近S病毒高端型成品
        - 穴道内壁自带润滑，温度略低于活人
        - 不腐败，避光密封存放即可，阳光直射超过六小时缓慢消散
      征服型猎获物: 击败敌意实体后征服的个体智能更高——能进行短句对话、理解复杂指令、主动判断简单威胁，可作为战斗护卫使用

    改造兼容性:
      - 对物理改造零排异
      - 兼容智械改造
      - 不兼容S病毒和灵异注入（叠加导致消散）

    器官特性:
      - 器官无法独立于躯体存在，摘除后三十秒内消散为灰色粉末
      - 无移植和贩售价值

    日常维护:
      - 避光密封存放，天然防腐
      - 阳光直射六小时消散
      - 需注意不要进行S病毒或灵异注入改造
