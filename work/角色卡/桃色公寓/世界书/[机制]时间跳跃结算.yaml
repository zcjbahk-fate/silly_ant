## 时间跳跃与月末结算机制
当{{user}}选择“跳过该月”或推进至下个月1号时，按以下逻辑进行自动结算与状态刷新：
1. **自动收租结算**：
   - 准时交租租客（如301室温知夏）自动完成租金扣缴并增加资金（+6000元）；
   - 拖欠/抵扣租客按其当前好感度与恶堕状态自动结算对应的抵债事件（如扣留抵押物、默许特殊服务抵扣等）；
   - 霸占101室的沈曼卿母女不交租金并触发例行勒索扣除（-1000~2000元）；
2. **扣除月度基础运营开支**：扣除公寓月度基础维护费与水电能耗（约 5000~8000 元）；
3. **日历跳转**：强制将时间推进至下月1号 08:00（如 2025年7月1日 08:00）；
4. **全员状态刷新**：全员“现在在做”字段刷新为月初收租日清晨的新状态；
5. **剧情事件判定**：根据所处剧情阶段，推进暗线进度（如沈曼卿借款加码、女租客媚黑秘密痕迹等）。
</机制_时间跳跃>
