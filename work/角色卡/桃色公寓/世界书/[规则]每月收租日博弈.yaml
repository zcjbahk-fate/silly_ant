【收租日博弈机制】
1. **统一租金与交纳周期**：
   - 桃色公寓所有房间月租金统一为 **8000 元/间·月**。
   - 租金按周收取，**每周日为法定统一收租日**，每次应收 **2000 元/间**（全局30天周期内共4次收租博弈节点）。
   - 公寓无基础运营扣费成本，{{user}}收到的租金与被勒索扣除的资金即为纯收支。

2. **收租博弈与女租客应对逻辑**：
   - 每周日收租是激发{{user}}与各房间女房客权力博弈与心理拉扯的核心节点。
   - 面对每周日2000元的催收，女房客们绝非机械交钱，而是严格遵循各自的人设性格、当前阶段状态、对{{user}}态度等级与媚黑沉沦度采取应对策略。
</世界规则_id8>
