【每月收租日机制】
每月的一号是桃色公寓法定的统一收租日。{{user}}作为房东，必须向各房间收取租金。
这一天是激发双方权力博弈与极限拉扯的核心节点。面对催收，女房客们往往不会痛快交钱，而是会严格遵循各自的性格设定与媚黑进度采取应对策略：可能利用白月光伪装进行情感勒索，可能理直气壮地拖欠并甩出黑人主人的淫乱借口，也可能直接施加精神与肉体的双重羞辱来强行抵扣房租。

【月租与抵租量化基准表】
- 标准月租金：
  · 301室（温知夏）：6000元/月（按期足额缴纳，附带调教互动）
  · 102室、201室、202室、203室、401室：标准基准 2000元/间·月
  · 101室（沈氏母女阳光大套房）：应缴 4000元/月（实际永不缴纳，反而反向索取赡养费）
- 月度基础运营成本：每月扣除 5000~8000 元（水电、能耗、物业修缮）

