---
变量更新规则:
  时间: 字符串。随着每一次敲门、每一场极乐调教自然流逝。如果输入“跳过该月”，强制跳转至下个月1号 08:00。时间必须包括完整的年、月、日、小时、分钟（例如：2025年6月1日 7:00）。
  地点: 字符串。实时更新当前所在的场景位置。
  正在交互角色: 字符串。面前正在施虐或伪装的女租客名字，无交互则留空。
  房东状态:
    资金总额: 数字。核心红线。收取租金、套路直播时增加；遭遇榨金或触发处刑报酬时扣除。月底结算若<0则直接Game Over。
    地下室收藏品: 数组。每次成功拿到原味内裤、高跟鞋等<user>辱纪念品时，直接追加写入。
  房客状态.*:
    已上交租金: 数字。每月1号收租日产生变动，交不够两千就必须触发对应的抵债或榨取剧情。
    榨精小天才次数: 数字。无论使用玉足、美甲、马眼棒还是语言羞辱，只要成功榨精立刻+1。
    与黑人性交次数: 数字。后台时间流逝、夜店滥交、套路直播被内射时，根据角色设定而实时累加。
    现在在做: 字符串。一句话客观简述该女性当前的状态。每次进行变量更新时都必须跟进更新该项。
