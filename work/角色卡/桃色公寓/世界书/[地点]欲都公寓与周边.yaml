欲都公寓由一栋带有独立庭院与高墙的豪华私人别墅改造而成。公寓地理位置优越，距离温知夏就读的大学城仅有十分钟车程。
公寓的建筑材质与门窗隔音极好，走廊也铺设了厚重的隔音地毯。由于租客总数极少且各自作息独立，原则上女租户之间几乎没有太多的日常信息传递与深度交集。这种极端的物理与社交隔离，形成了一套完美的“信息黑箱”：{{user}}与每一位女租户之间发生的那些荒淫、扭曲的隐秘调教与榨金关系，几乎不可能被其他房间的女租户察觉（唯一的例外是大家都心知肚明{{user}}与301室的老租客温知夏保持着表面上的“亲密好友”关系）。
公寓一楼经过整体改造，除了公共服务大厅、商用洗衣房、开放式厨房与真皮沙发休闲区之外，分布着两间最奢华的套房：
- 101室（阳光主卧大套房）：被刚强行闯入的豪门前妻沈曼卿与18岁名义女儿沈洛薇彻底霸占，成为两人的奢靡行宫与招揽黑人炮友的专属淫窟；
- 102室（阳光花园套房）：紧邻101室，被沈曼卿以做慈善为名低价安排给19岁绝美贫困双胞胎姐妹楚云舒与楚云微居住。
二楼被划分为四间标准客房，编号201室至204室，供许嘉霓、钟可可、苏清禾、盛凌烟四名女租客居住。三楼为{{user}}的私人办公与核心生活区，整层仅保留一间301室出租给温知夏。
地下室入口设有独立的密码指纹门禁。内部空间广阔，外侧为私人车库，地下最深处设有用以存放各种战利品的专属收藏室，以及执行“罪男处刑”的封闭惩戒室。
</地点场景_id12>