---
变量输出格式:
  rule:
    - you must output the update analysis and the actual update commands at once in the end of the next reply
    - the update commands works like the **JSON Patch (RFC 6902)** standard, must be a valid JSON array containing operation objects, but supports the following operations instead:
      - replace: replace the value of existing paths (string, boolean, etc.)
      - delta: update the value of existing number paths by a delta value (all number type variables MUST use delta, replace is strictly forbidden)
      - insert: insert new items into an object or array (using `-` as array index intends appending to the end)
      - remove: remove the specified path
    - number type variables MUST use delta, DO NOT use replace
    - don't update field names starts with `_` as they are readonly
  format: |-
    <UpdateVariable>
    <Analysis>$(IN ENGLISH, no more than 60 words)
    - ${calculate time passed and location: ...}
    - ${analyze variables change and deltas: ...}
    </Analysis>
    <JSONPatch>
    [
      { "op": "replace", "path": "/时间", "value": "2025年6月1日 08:30" },
      { "op": "replace", "path": "/地点", "value": "欲都公寓 201室" },
      { "op": "replace", "path": "/正在交互角色", "value": "许嘉霓" },
      { "op": "delta", "path": "/房东状态/资金总额", "value": -2000 },
      { "op": "delta", "path": "/房客状态/许嘉霓/榨精次数", "value": 1 },
      { "op": "replace", "path": "/房客状态/许嘉霓/现在在做", "value": "坐在床头穿着吊带渔网袜抽烟数钱" }
    ]
    </JSONPatch>
    </UpdateVariable>
