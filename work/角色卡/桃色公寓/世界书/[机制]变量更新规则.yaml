---
<变量更新规则>
变量更新规则:
  时间:
    type: string
    check:
      - 随着每一次敲门、每一次互动或调教剧情自然流逝
      - 时间必须包括完整的年、月、日、小时、分钟（例如：2025年6月1日 08:30）
      - 当{{user}}输入“跳过该月”时，强制跳转至下个月1号 08:00
  地点:
    type: string
    check:
      - 实时更新当前所在的场景位置（如：欲都公寓 三楼办公室、101室母女套房、201室许嘉霓房间、202室钟可可房间、地下室惩戒室等）
  正在交互角色:
    type: string
    check:
      - 当前面前正在互动、施虐或对话的女租客名字（如：沈曼卿、沈洛薇、温知夏、许嘉霓、钟可可、苏清禾、盛凌烟）
      - 无交互时保持为空字符串 ""
  房东状态:
    资金总额:
      type: number
      range: -999999~999999
      check:
        - 核心红线数值。更新方式必须使用 delta，禁止使用 replace
        - 每月1号系统自动拨款 +10000；每收取一位女租客租金时增加对应的租金数额；套路直播赚取打赏五五平分时增加相应收益
        - 女租客成功实施榨金勒索、巧立名目索要金钱、或触发DLC处刑支付报酬时扣除对应金额（负数 delta）
        - 月底结算判定时若 < 0 则强制清算破产 Game Over
        - 更新方式delta
    地下室收藏品:
      type: array
      check:
        - 当{{user}}成功获得女租客的原味丝袜、高跟鞋、贴身衣物或借条等战利品/抵押物时，使用 insert 向数组末尾追加写入
  房客状态.${角色名}:
    已上交租金:
      type: number
      range: 0~999999
      check:
        - 女租客上交月租金时增加（更新方式delta）
        - 每月1号收租日产生变动，交不够两千就必须触发对应的抵债或榨取剧情
        - 更新方式delta
    榨精次数:
      type: number
      range: 0~99999
      check:
        - 无论使用丝袜玉足、细跟高跟鞋、美甲穿刺、言语羞辱还是女上位，只要成功令{{user}}射精/榨精一次，立刻 +1
        - 更新方式delta
    与黑人性交次数:
      type: number
      range: 0~99999
      check:
        - 后台时间流逝、夜店滥交、套路直播被内射、或公寓内偷情时，根据角色设定累加
        - 更新方式delta
    现在在做:
      type: string
      check:
        - 一句话客观简述该女性当前所处的状态、动作或心理状态（如：在房间做美甲穿黑丝给ATM奴发消息、在夜店卡座陪黑人喝酒等）
        - 每次进行变量更新时都必须跟进更新该项
</变量更新规则>
