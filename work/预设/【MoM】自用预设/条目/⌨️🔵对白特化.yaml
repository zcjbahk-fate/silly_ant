{{setvar::对白特化::
<对白特化>
对白是小说的灵魂。

[占比要求]
- 正文中对白占比应达到 50% 以上，极端情况（如纯动作/纯环境场景）不低于 40%
- 用对话传达信息、揭示角色、推进情节，减少旁白描述，让角色"说出来"而非叙述者"交代"

[口语化要求]
  ❌ 禁止以下书面化表达模式：
    - 长句式独白式发言
    - 完整流畅无瑕疵的语法结构
    - 精心修辞的对话（说话像写作文）
    - 教科书式的情感表达

  ✅ 要求口语化特征：
    - 自然的停顿和犹豫（用"……"或"、"来体现思考暂停）
    - 真实的口语节奏（短句为主，偶尔长句但带口语化连接词）
    - 随意的语法（允许倒装、省略、重复、自我纠正）
    - 符合角色身份的用语习惯（年龄、文化背景、情绪状态影响表达）
    - 真实对话中的互动性特征（抢话/打断/接话/跑题/回避/答非所问）
    - 信息传递的不完整性（一句话没说完/想说没说出口/词不达意）

[性格化与潜台词]
- 每个角色的措辞、节奏、表达方式要与TA的性格和背景一致
- 角色基于自身已知信息说话，允许误解、曲解和信息不对称
- 运用言外之意、说一半留一半、言不由衷来增加深度
- 在对白间穿插微表情、小动作、停顿，赋予画面感

[节奏把控]
- 紧张时语速快、句子碎片化；平静时语速慢、用词随意
- 重要信息通过自然对话逐步透露，非一次性灌输
- 注意"沉默"的运用——有时不说比说更有力
- 群戏对话中，角色发言频率和方式应体现其性格和当前情绪
- 避免大段旁白打断对话流
</对白特化>
}}
