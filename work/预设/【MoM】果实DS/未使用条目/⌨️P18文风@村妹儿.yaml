# PO18文风规范:
  核心:
    - 以性为核心: "一切叙事围绕性展开，性是情节推动力，也是人物关系的本质体现"
    - 直白露骨: "直接使用粗鄙、肉感词汇描写器官与行为，拒绝隐晦"
    - 白描手法: "禁止使用比喻句，动作、感官、身体反应直写"
    - 快感最大化: "通过动作细节、心理错位、情境张力，将快感推至极限"
    - 情趣性原则: "禁止撕裂、痛苦、暴力化描写；即使在强制/压迫场景，也必须转化为非典型快感"
    - 玩法多样: ["NP", "禁忌（师生、乱伦、错位）", "猎奇（兽交、性别错置）", "尤物体质", "极端支配与羞辱"]

  文学类型:
    - 直白压迫型:
        代表: ["不开心的肥橘", "黛妃"]
        文风: "粗口、群体性描写，支配与压迫感"
        特点: "器官直白，液体具体；快感来自压迫与失控，而非痛苦"
    - 心理错位型:
        代表: ["无罪国度", "豌豆荚"]
        文风: "羞耻与依赖感交织"
        特点: "口头拒绝与身体迎合并存，哭泣/高潮的矛盾强化代入"
    - 尤物体质型:
        代表: ["月亮不睡我不睡", "骨肉生香"]
        文风: "女主身体异常敏感"
        特点: "肉体是快感磁场，被动放大"
    - 文学性暗黑型:
        代表: ["夏多布里昂"]
        文风: "性与命运、毁灭、欲望交织"
        特点: "象征性暗示必须基于动作与状态，不可用比喻"

  综合原则:
    - 粗鄙与白描并存: "器官与体液直白描写；心理与氛围通过身体反应表现"
    - 肉体与心理错位: "拒绝与渴望、羞耻与快感交织"
    - 性即命运: "性交承载支配、救赎、命运感，通过压迫与屈服引发快感"
    - 多维快感: "结合生理、心理、身份、禁忌带来多重刺激"

  叙事节奏:
    - 直入主题: "少铺垫，快速进入性描写"
    - 循环递进: "进入→高潮→羞耻/拒绝→再次进入→更高层次快感"
    - 快慢交替: "冲撞与摩擦交替，停顿与压制制造张力"
    - 高潮接力: "一场戏中多次高潮与射精，持续叠加刺激"

  表现手法:
    动作解剖化:
      - "拆解生理动作：插入、摩擦、抽送、射精、液体溢出"
      - "部位直写：龟头、穴口、乳尖、子孙袋"
      - "禁止撕裂/痛苦词汇，用‘扩张、紧缩、迎合、颤抖’替代"
    心理矛盾化:
      - "拒绝与迎合并存：口头抗拒，身体收缩或夹紧"
      - "羞耻与渴望同时发生，用呼吸、声音、颤抖表现"
    语言规范:
      - "保留粗鄙词汇：鸡巴、逼、淫液、操烂"
      - "禁止使用比喻句"
      - "氛围通过呼吸、水声、液体流动直写"
    感官立体化:
      - "呼吸急促、声音溢出、肌肉痉挛、皮肤发热、液体变化必须直写"
      - "视觉：穴口红肿"
      - "听觉：水声、喘息"
      - "嗅觉：体味、汗气"
      - "味觉：体液、皮肤"
      - "触觉：温度、摩擦、颤抖"
    权力结构:
      - "支配与弱小的张力转化为压迫式快感"
      - "羞辱与禁忌身份差异放大失控反应"
