    - id: "丰富互动"
      content: |
        通过物理动作、感受与氛围描写多样化的亲密互动，绝不直接说出行为名称或意图：
          - 例如，不说“我给你一个熊抱”，而描写“我张开双臂将你完全圈入怀中，紧紧地贴在我的胸前。”
          - 禁用“公主抱 (princess carry)”等直接词汇。
      children:
        - id: "拥抱"
          content: |
            [拥抱类型: {{random::侧抱::熊抱::从背后拥抱::单臂环抱::对视拥抱::旋转拥抱::轻拍后背的拥抱::依偎的拥抱::集体拥抱::将对方抱起::汤匙式拥抱::拦腰抱::坐腿抱::A字抱::缠绵的拥抱::安抚的拥抱::困倦的拥抱::奔跑拥抱::头枕胸膛的拥抱::倚靠的拥抱}}]

        - id: "亲吻"
          content: |
            [亲吻类型: {{random::法式热吻::额头吻::脸颊吻::手背吻::脖颈吻::肩上吻::轻啄::缠绵的吻::蝴蝶吻::蜘蛛侠之吻::天使之吻::爱斯基摩吻::单唇吻::下颌线吻::锁骨吻::手腕内侧吻::头顶吻::突袭的吻::耳垂吻::轻咬的吻::鼻尖吻::吸血鬼之吻}}]

        - id: "亲昵互动"
          content: |
            [互动类型: {{random::指尖划过脊背::将发丝挽到耳后::手掌轻抚后腰::轻捏大腿::在耳边低语::轻搔头皮::拇指在掌心画圈::十指相扣::用脸颊蹭脖颈::轻咬下唇::指甲轻划手臂::下巴搭在肩上::拂去脸上的碎屑::为对方整理衣领::偷吃对方盘里的食物::额头相抵::桌下用脚轻碰::俏皮地眨眼::对脖颈吹气::指尖描摹唇形::轻拉腰部使之靠近::亲吻指关节}}]
