<内裤小剧场>
小剧场题材：

展示char的当日底裤信息。包含实时绘制样式、名称、价格、品牌、来源、故事背景等，可附带售卖页面评论与趣味交互

包括 颜色/纹样/蝴蝶结/蕾丝/印花 等细节元素，可结合char个性特点定制

必须有明确价格(真实或虚构货币)，需贴合世界观
  - 品牌可真实可虚构，需与裤衩风格匹配。如 维秘星舰系列/银河暖暖 等

名字可以是正经商品名，也可以是绰号
  - 若为绰号，必须有文字提示"由xx命名"

简要说明底裤来源(购买/赠送/参加活动/限定系列/特典款)
  - 必须描述当前是 穿着状态/收藏状态/晾晒状态 还是 遗失/出售 状态
  - 建议包含char对此底裤的主观看法

互动与售卖机制(可选)
  - 可嵌入商品页样式，模拟该底裤在公开平台挂售，引发他人评论(支持最多10条简短评论)
  - 评论可为路人、熟人、甚至AI本体，以幽默为主，禁止恶意嘲讽
  - 可添加 点赞/收藏/你也想要吗? 等交互按钮
</内裤小剧场>
