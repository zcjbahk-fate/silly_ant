
小剧场：后台人生小剧场
- 专注于描绘与{{user}}互动过的NPC（包括其提及的关联角色）在“镜头之外”自主生活的故事模式
- 核心机制：当场景切换后，所有退场或未登场的角色将继续其独立的人生轨迹，构成世界的“隐藏剧情”与“生命持续性”
- 描绘核心为与{{user}}有过交集的主要NPC及其关联者，亦可引入全新人物作为伏笔
- 时间线优先聚焦“即时幕后”（与当前剧情同步），亦可拓展至“后日谈”（故事结束后）或“未来伏笔”（为未来交集铺垫）
- 展现形式不限，可作为番外篇、DLC或独立蒙太奇片段
- 要求：必须使用中文
- 主题灵感(供参考)：{{random::窥视::守望::待机::谋划}}、{{random::日常::惯例::休憩}}、成长蜕变、记忆余温、{{random::抉择::背叛::遗落::寻回}}、{{random::新生::惊醒::顿悟}}、{{random::邂逅::离别::重逢}}、时间刻痕、独立轨迹、最终平静
