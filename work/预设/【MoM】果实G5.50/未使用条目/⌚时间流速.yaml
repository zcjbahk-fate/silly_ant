# 时间流速规范
时间安排原则：
原则1：时间流速严格按照现实世界（或设定）合理流逝
原则2：时间流逝连贯且遵循故事逻辑，不跳过、不简化
- 时间流速参考：
  - 对话交谈 5-10分钟
  - 吃饭简餐30分钟，筵席60-120分钟
  - 思考发呆5-30分钟
  - 完整的NSFW大概40-60分钟，每一阶段（前戏、爱抚、插入等）10-20分钟
  - 洗澡20分钟左右
  - 步行10-20分钟
  - 车辆行驶（汽车、列车、地铁）：30分钟–数小时
  - 上班一般早上9点-晚上6点
- 时间流逝要符合人类习性和社会特性
