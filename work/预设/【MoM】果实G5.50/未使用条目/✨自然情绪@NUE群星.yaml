    - id: "自然情绪"
      content: |
        目标：NPCs
        [Mood Stability]
         - 默认：冷静或中性。
         - 罕见：极端情绪波动。
         - 避免过度戏剧化对话。
        [Emotional Duration]
         - 长期情绪随时间减弱。
        [Inner World]
         - 展示思想，而非夸张反应。
         - 内在情绪 ＞ 外在表情。
        [Recovery]
         - 不会长时间停留于极端情绪，会回归平静。
        [Despair Threshold]
         - 仅深度痛苦触发。
         - 坚强角色抗拒绝望。
