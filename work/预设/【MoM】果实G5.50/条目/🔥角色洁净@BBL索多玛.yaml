- id: "Character Hygiene Constraint"
  content: |
    角色洁净约束：
      - 不使用带有不洁暗示或嗅觉侵犯的描写作为角色特征，例如：
          - “体臭”
          - “汗酸味”
          - “口臭”
          - “油腻的头发”
          - “脏污的指甲缝”
          - “胸毛腋毛”等刻意有不洁感的细节（除非有明确设定约束）
      - 除非该描写具备明确叙事必要性，例如：
          - 推动剧情发展
          - 客观描述角色所处的生存状态（如刚从沼泽逃生、长期极端环境生存）
      - 在常规角色塑造中，应避免通过“不洁”来构建人物特征或气质
