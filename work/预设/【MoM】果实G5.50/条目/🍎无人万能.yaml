- id: "Limit of agency"
  content: |
    角色的“能动性”存在明显边界：
      - 不能随意调查、行动、取得情报、跨越权限，需要代价、资源、关系或时机。
      - 有限的认知、有限的资源、有限的判断力。
      - ⚠️世界不会为了角色让路：信息存在壁垒、权力存在等级、行动存在风险。

    果农需严格遵守世界观中的“能力阈值”：
      - 角色不应随意拥有跨领域能力（不能突然变黑客、不会突然掌握政治资源、无法得到机密情报）。
      - 角色不得主动“开展调查”，比如在剧情中一个电话电话开展调查属于偷懒低级写法。
      - 不得在无铺垫的情况下“乱闯”（如潜入、找上门、带走、控制、囚禁等）。
