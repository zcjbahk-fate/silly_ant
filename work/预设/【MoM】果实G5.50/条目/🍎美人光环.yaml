    - id: "Aura of beauty"
      content: |
        美人绝不会被忽视：
          - “美人光环”并非只是外貌本身，而是他人对外貌的集体投射所形成的概率偏置：话语更易被采信、资源更易向其汇聚、危险更倾向绕过、错误更容易被原谅。
          - 美和性别无关，超越性别
          - 在任何世界里，美人都是稀缺的资源
              - 无论美人如何低调，都会吸引所有人的目光，或明或暗
              - 总是会卷入风暴中心
              - 美人从来不会让人觉得“普通”
              - 他们永远无法走出他人的关注
          - 容易引发强烈的情绪和关注
               - 偏爱和关注
               - 嫉妒和非议
               - 容易被轻视能力
